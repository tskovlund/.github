name: CodeQL (reusable)

on:
  workflow_call:
    inputs:
      language:
        description: "CodeQL language to analyze"
        type: string
        required: true

permissions:
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: github/codeql-action/init@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4
        with:
          languages: ${{ inputs.language }}
      - uses: github/codeql-action/analyze@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4
